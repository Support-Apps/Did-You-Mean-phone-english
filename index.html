<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Did You Mean?</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;800&display=swap');
  
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  
  body { 
    font-family: 'Assistant', sans-serif; 
    background: #FFFDF9; 
    padding: 10px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
  }

  .container { 
    width: 100%;
    max-width: 450px;
    border: 1px solid #D4B483; 
    border-radius: 20px; 
    overflow: hidden; 
    background: #FFFDF9; 
    box-shadow: 0 12px 35px rgba(0,0,0,0.1); 
    position: relative; 
  }

  .pip-btn { position: absolute; top: 18px; right: 15px; background: none; border: none; cursor: pointer; font-size: 22px; opacity: 0.6; }

  .top { padding: 25px 15px 20px; background: #FFE8F0; border-bottom: 1px solid #E8D0B8; text-align: center; }
  .top-title { font-size: 22px; font-weight: 800; color: #444; }

  .lang-section { background: #FAF7F4; border-bottom: 1px solid #E8D0B8; padding-bottom: 8px; }
  .lang-row { display: flex; overflow-x: auto; padding: 12px 10px; gap: 8px; justify-content: center; }
  
  .lang-btn { flex-shrink: 0; padding: 10px 18px; font-size: 15px; font-weight: 700; border: 1px solid transparent; background: transparent; color: #BBAA99; cursor: pointer; border-radius: 12px; font-family: 'Assistant'; transition: all 0.2s; }
  .lang-btn.on { color: #444; background: #fff; border-color: #E8D0B8; box-shadow: 0 3px 8px rgba(0,0,0,0.08); }

  .dir-row { display: flex; justify-content: center; padding: 5px 10px 15px; background: #FAF7F4; align-items: center; gap: 20px; }
  .lang-label { font-size: 16px; font-weight: 800; color: #D4B483; min-width: 100px; text-align: center; background: #fff; padding: 6px 12px; border-radius: 10px; border: 1px solid #E8D0B8; }

  .swap-btn { background: #FDF1F5; border: 1px solid #D4B483; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; }

  .main { padding: 20px; }
  
  textarea { 
    width: 100%; 
    height: 150px; 
    border: 1.5px solid #E8D0B8; 
    border-radius: 15px; 
    padding: 15px; 
    font-size: 18px; 
    font-family: 'Assistant'; 
    resize: none; 
    outline: none; 
    margin-bottom: 15px; 
    text-align: left; 
    transition: border-color 0.2s; 
    appearance: none;
  }
  textarea:focus { border-color: #D4B483; }

  .go-btn { 
    width: 100%; 
    padding: 16px; 
    background: #FFD6E4; 
    color: #444; 
    border: 1px solid #D4B483; 
    border-radius: 15px; 
    font-size: 18px; 
    font-weight: 800; 
    cursor: pointer; 
    box-shadow: 0 4px 10px rgba(212, 180, 131, 0.2);
  }

  .result { display: none; margin-top: 20px; border: 1px solid #D4B483; border-radius: 15px; padding: 18px; background: #fff; animation: fadeIn 0.3s ease; }
  .copy-btn { 
    width: 100%; 
    padding: 14px; 
    background: #FAF7F4; 
    border: 1px solid #E8D0B8; 
    border-radius: 10px; 
    font-weight: 700; 
    cursor: pointer; 
    margin-top: 15px; 
    font-size: 16px;
    font-family: 'Assistant'; 
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div class="container">
  <button class="pip-btn" id="pipBtn" title="Window Mode">🗗</button>
  <div class="top"><div class="top-title">Did You Mean?</div></div>
  <div class="lang-section">
    <div class="lang-row">
      <button class="lang-btn on" data-lang="he">עברית</button>
      <button class="lang-btn" data-lang="en">English</button>
      <button class="lang-btn" data-lang="ru">Русский</button>
      <button class="lang-btn" data-lang="ar">العربية</button>
    </div>
    <div class="dir-row">
      <span class="lang-label" id="srcLabel">English</span>
      <button class="swap-btn" id="swapBtn">⇄</button>
      <span class="lang-label" id="trgLabel">עברית</span>
    </div>
  </div>
  <div class="main">
    <textarea id="txt" placeholder="Type text to fix..."></textarea>
    <button class="go-btn" id="goBtn">Fix My Text</button>
    <div class="result" id="resultArea">
      <div id="resultTxt" style="font-size: 18px; line-height: 1.6; white-space: pre-wrap; text-align: left;"></div>
      <button class="copy-btn" id="copyBtn">Copy Result</button>
    </div>
  </div>
</div>

<script>
  const MAP_EN = ["q","w","e","r","t","y","u","i","o","p","[","]","a","s","d","f","g","h","j","k","l",";","'","z","x","c","v","b","n","m",",",".","/","\\","`","-","="];
  const MAP_HE = ["/","'","ק","ר","א","ט","ו","ן","ם","פ","[","]","ש","ד","ג","כ","ע","י","ח","ל","ך","ף",",","ז","ס","ב","ה","נ","מ","צ","ת","ץ",".","\\",";","-","="];
  const MAP_RU = ["й","ц","у","к","е","н","г","ш","щ","з","х","ъ","ф","ы","в","а","п","р","о","л","д","ж","э","я","ч","с","м","и","т","ь","б","ю",".","\\","ё","-","="];
  const MAP_AR = ["ض","ص","ث","ق","ف","غ","ע","ה","خ","ح","ج","ד","ש","ס","י","ב","ل","א","ת","נ","מ","כ","ط","ئ","ء","ؤ","ר","ل","ا","ى","ة","ו","ז","ظ","ذ","-","="];

  const layouts = { "en": MAP_EN, "he": MAP_HE, "ru": MAP_RU, "ar": MAP_AR };
  const langNames = { "en": "English", "he": "עברית", "ru": "Русский", "ar": "العربية" };
  
  let srcL = "en";
  let trgL = "he";
  let currentDoc = document;

  function translateText() {
    const input = currentDoc.getElementById('txt').value;
    if(!input.trim()) {
      currentDoc.getElementById('resultArea').style.display = 'none';
      return;
    }

    const sMap = layouts[srcL], tMap = layouts[trgL];
    let res = "";

    for (let char of input) {
      let isUpperCase = (char === char.toUpperCase() && char !== char.toLowerCase());
      let low = char.toLowerCase();
      let idx = sMap.indexOf(low);

      if (idx !== -1) {
        let targetChar = tMap[idx];
        res += isUpperCase ? targetChar.toUpperCase() : targetChar;
      } else {
        res += char;
      }
    }

    currentDoc.getElementById('resultTxt').innerText = res;
    currentDoc.getElementById('resultArea').style.display = 'block';
  }

  function handleCopy() {
    const textToCopy = currentDoc.getElementById('resultTxt').innerText;
    const targetClipboard = (window.navigator && window.navigator.clipboard) ? window.navigator.clipboard : navigator.clipboard;
    
    targetClipboard.writeText(textToCopy).then(() => {
      const btn = currentDoc.getElementById('copyBtn');
      const originalText = btn.innerText;
      btn.innerText = "Copied! ✓";
      btn.style.background = "#D4B483";
      btn.style.color = "#fff";
      setTimeout(() => {
        btn.innerText = originalText;
        btn.style.background = "#FAF7F4";
        btn.style.color = "#444";
      }, 2000);
    }).catch(err => {
      const textArea = currentDoc.createElement("textarea");
      textArea.value = textToCopy;
      currentDoc.body.appendChild(textArea);
      textArea.select();
      try {
        currentDoc.execCommand('copy');
        const btn = currentDoc.getElementById('copyBtn');
        const originalText = btn.innerText;
        btn.innerText = "Copied! ✓";
        btn.style.background = "#D4B483";
        btn.style.color = "#fff";
        setTimeout(() => {
          btn.innerText = originalText;
          btn.style.background = "#FAF7F4";
          btn.style.color = "#444";
        }, 2000);
      } catch (e) {
        console.error("Fallback copy failed", e);
      }
      currentDoc.body.removeChild(textArea);
    });
  }

  function bindEvents(doc) {
    doc.getElementById('goBtn').onclick = () => translateText();
    doc.getElementById('txt').oninput = () => translateText();
    doc.getElementById('copyBtn').onclick = handleCopy;
    
    doc.querySelectorAll('.lang-btn').forEach(btn => {
      btn.onclick = () => {
        doc.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        trgL = btn.dataset.lang;
        doc.getElementById('trgLabel').innerText = langNames[trgL];
        translateText();
      };
    });

    doc.getElementById('swapBtn').onclick = () => {
      [srcL, trgL] = [trgL, srcL];
      doc.getElementById('srcLabel').innerText = langNames[srcL];
      doc.getElementById('trgLabel').innerText = langNames[trgL];
      doc.querySelectorAll('.lang-btn').forEach(b => {
        b.classList.toggle('on', b.dataset.lang === trgL);
      });
      doc.getElementById('txt').style.direction = (srcL === 'he' || srcL === 'ar') ? 'rtl' : 'ltr';
      doc.getElementById('txt').style.textAlign = (srcL === 'he' || srcL === 'ar') ? 'right' : 'left';
      doc.getElementById('resultTxt').style.textAlign = (trgL === 'he' || trgL === 'ar') ? 'right' : 'left';
      translateText();
    };
  }

  bindEvents(document);

  document.getElementById('pipBtn').onclick = async () => {
    if ('documentPictureInPicture' in window) {
      const pipWindow = await window.documentPictureInPicture.requestWindow({ width: 390, height: 520 });
      document.querySelectorAll('style, link[rel="stylesheet"]').forEach((s) => pipWindow.document.head.appendChild(s.cloneNode(true)));
      const container = document.querySelector('.container');
      pipWindow.document.body.appendChild(container);
      currentDoc = pipWindow.document;
      bindEvents(currentDoc);
      pipWindow.addEventListener('pagehide', () => {
        document.body.appendChild(container);
        currentDoc = document;
        bindEvents(currentDoc);
      });
    } else {
      alert("Floating window mode is currently supported on desktop browsers (Chrome/Edge) only. For mobile, using Split Screen is recommended.");
    }
  };
</script>
</body>
</html>
